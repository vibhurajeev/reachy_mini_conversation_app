<svg viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Robot avatar">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2e8f0"/>
      <stop offset="1" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>
  <circle cx="80" cy="82" r="70" fill="#0f172a" opacity="0.06"/>
  <!-- antennas -->
  <line x1="56" y1="34" x2="50" y2="14" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <circle cx="50" cy="12" r="6" fill="#34d399"/>
  <line x1="104" y1="34" x2="110" y2="14" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <circle cx="110" cy="12" r="6" fill="#34d399"/>
  <!-- head -->
  <rect x="34" y="40" width="92" height="82" rx="30" fill="url(#body)" stroke="#475569" stroke-width="3"/>
  <!-- face plate -->
  <rect x="48" y="58" width="64" height="42" rx="21" fill="#0f172a"/>
  <!-- eyes -->
  <circle cx="68" cy="79" r="7" fill="#38bdf8"/>
  <circle cx="92" cy="79" r="7" fill="#38bdf8"/>
</svg>
